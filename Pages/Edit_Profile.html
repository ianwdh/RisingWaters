<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Profile</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      body {
        margin: 0;
        font-family: "Luckiest Guy", cursive;
        height: 100vh;
        position: relative;
        overflow: hidden;

        /* Center the form */
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Background video */
      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      .edit-profile-form {
        background: rgba(0, 0, 0, 0.6);
        padding: 30px 40px;
        border-radius: 20px;
        text-align: center;
        color: white;
        width: 350px;
        position: relative;
        z-index: 1;
      }

      .edit-profile-form img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-bottom: 20px;
        border: 2px solid white;
      }

      .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        justify-content: center;
      }

      .form-group input {
        font-family: "Luckiest Guy", cursive;
        font-size: 1.3rem;
        padding: 8px;
        border-radius: 10px;
        border: none;
        text-align: center;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        width: 200px;
        pointer-events: none;
      }

      .form-group i {
        font-size: 1.5rem;
        margin-left: 10px;
        cursor: pointer;
      }

      .form-group input.editable {
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.4);
      }

      /* Save button - blue default, green on hover */
      .btn-save {
        font-family: "Luckiest Guy", cursive;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 1.5rem;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn-save:hover {
        background: #00ff00;
        color: #000;
      }

      /* Alert on top */
      .alert {
        font-family: "Luckiest Guy", cursive;
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 1.2rem;
        display: none;
        z-index: 10;
      }

      .alert.success {
        background: #4caf50;
        color: white;
      }
      .alert.error {
        background: #f44336;
        color: white;
      }

      /* Back to Game Button */
      #backBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-family: "Luckiest Guy", cursive;
        font-size: 1.5rem;
        padding: 10px 20px;
        border-radius: 12px;
        border: none;
        background: #3498db;
        color: white;
        cursor: pointer;
        transition: 0.3s transform, 0.3s background;
        z-index: 100;
      }

      #backBtn:hover {
        transform: scale(1.2);
        background: #5dade2;
      }
    </style>
  </head>
  <body>
    <!-- Background video -->
    <video class="background-video" autoplay loop muted playsinline>
      <source src="../Animations/Homepage.mp4" type="video/mp4" />
    </video>

    <!-- Alert -->
    <div class="alert" id="alertBox"></div>

    <!-- Profile form -->
    <div class="edit-profile-form">
      <img src="https://via.placeholder.com/100" alt="Profile Picture" />

      <div class="form-group">
        <input type="text" id="usernameInput" value="Player" />
        <i class="bi bi-pencil-fill" id="editUsername"></i>
      </div>

      <div class="form-group">
        <input type="password" id="passwordInput" value="password123" />
        <i class="bi bi-pencil-fill" id="editPassword"></i>
      </div>

      <button class="btn-save" id="saveBtn">Save</button>
    </div>

    <!-- Back to Game Button -->
    <button id="backBtn">Back to Game</button>

    <script>
      const usernameInput = document.getElementById("usernameInput");
      const passwordInput = document.getElementById("passwordInput");
      const editUsername = document.getElementById("editUsername");
      const editPassword = document.getElementById("editPassword");
      const saveBtn = document.getElementById("saveBtn");
      const alertBox = document.getElementById("alertBox");
      const backBtn = document.getElementById("backBtn");

      // Toggle editable
      editUsername.addEventListener("click", () => {
        usernameInput.classList.toggle("editable");
        usernameInput.focus();
      });
      editPassword.addEventListener("click", () => {
        passwordInput.classList.toggle("editable");
        passwordInput.focus();
      });

      // Save changes
      saveBtn.addEventListener("click", () => {
        const newUsername = usernameInput.value.trim();
        const newPassword = passwordInput.value.trim();

        if (!newUsername || !newPassword) {
          showAlert("Please fill in both fields", "error");
          return;
        }

        // AJAX request to PHP
        const formData = new FormData();
        formData.append("username", newUsername);
        formData.append("password", newPassword);

        fetch("../Logic/edit_profile.php", {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "ok") {
              showAlert(data.message, "success");
              usernameInput.classList.remove("editable");
              passwordInput.classList.remove("editable");
            } else if (data.status === "taken") {
              showAlert(data.message, "error");
            } else {
              showAlert("An error occurred", "error");
            }
          })
          .catch(() => showAlert("Server error", "error"));
      });

      function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = "alert " + type;
        alertBox.style.display = "block";
        setTimeout(() => (alertBox.style.display = "none"), 3000);
      }

      // Pre-fill username
      const savedUsername = sessionStorage.getItem("player_name");
      if (savedUsername) usernameInput.value = savedUsername;

      // Back to Game functionality
      backBtn.addEventListener("click", () => {
        const previousPage =
          sessionStorage.getItem("previousPage") || "/Pages/Homepage.html";
        window.location.href = previousPage;
      });

      // Save current page as previousPage when navigating to edit profile
      if (!sessionStorage.getItem("previousPage")) {
        sessionStorage.setItem(
          "previousPage",
          document.referrer || "/Pages/Homepage.html"
        );
      }
    </script>
  </body>
</html>
