<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Profile</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      body {
        margin: 0;
        font-family: "Luckiest Guy", cursive;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .background-video {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      .alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 25px;
        border-radius: 10px;
        font-size: 1.2rem;
        display: none;
        z-index: 300;
      }

      .alert.success {
        background: #4caf50;
        color: white;
      }

      .alert.error {
        background: #f44336;
        color: white;
      }

      .edit-profile-form {
        background: rgba(0, 0, 0, 0.85);
        padding: 30px 40px;
        border-radius: 20px;
        text-align: center;
        color: white;
        width: 350px;
        z-index: 1;
      }

      #currentAvatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid white;
        cursor: pointer;
        margin-bottom: 20px;
        transition: transform 0.3s;
      }

      #currentAvatar:hover {
        transform: scale(1.15);
      }

      .form-group {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        margin-bottom: 20px;
      }

      .form-group input {
        font-family: "Luckiest Guy", cursive;
        font-size: 1.3rem;
        padding: 8px;
        width: 180px;
        border-radius: 10px;
        border: 2px solid #000;
        text-align: center;
        background: #fff;
        color: #000;
        height: 38px;
        pointer-events: none;
      }

      .form-group input.editable {
        pointer-events: auto;
      }

      .form-group i {
        font-size: 1.5rem;
        cursor: pointer;
        margin-left: 15px;
      }

      .btn-save {
        background: #3498db;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 1.5rem;
        cursor: pointer;
        transition: 0.3s;
        font-family: "Luckiest Guy", cursive;
      }

      .btn-save:hover {
        background: #00ff00;
        color: black;
      }

      #backBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-family: "Luckiest Guy", cursive;
        font-size: 1.5rem;
        padding: 10px 20px;
        border-radius: 12px;
        border: none;
        background: #3498db;
        color: white;
        cursor: pointer;
        transition: 0.3s;
        z-index: 200;
      }

      #backBtn:hover {
        transform: scale(1.2);
      }

      .avatar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 250;
      }

      .avatar-grid {
        display: grid;
        grid-template-columns: repeat(4, 110px);
        gap: 20px;
      }

      .avatar-choice {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        cursor: pointer;
        transform: scale(0);
        border: 3px solid transparent;
        transition: transform 0.3s, border 0.3s;
      }

      .avatar-choice:hover {
        border: 3px solid #00ff00;
      }
    </style>
  </head>

  <body>
    <video class="background-video" autoplay loop muted playsinline>
      <source src="../Animations/Homepage.mp4" type="video/mp4" />
    </video>

    <div class="alert" id="alertBox"></div>

    <div class="edit-profile-form">
      <img
        id="currentAvatar"
        src="../ProfilePictures/NormalMale.png"
        alt="Profile Picture"
      />

      <div class="form-group">
        <input type="text" id="usernameInput" />
        <i class="bi bi-pencil-fill" id="editUsername"></i>
      </div>

      <div class="form-group">
        <input type="password" id="passwordInput" />
        <i class="bi bi-eye-fill" id="togglePassword"></i>
      </div>

      <button class="btn-save" id="saveBtn" data-i18n="save">Save</button>
    </div>

    <button id="backBtn" data-i18n="backToGame">Back to Game</button>

    <div class="avatar-overlay" id="avatarOverlay">
      <div class="avatar-grid" id="avatarGrid"></div>
    </div>

    <audio id="popSound" src="../Sounds/pop.mp3"></audio>

    <script>
      /* =========================
         Language System
      ========================= */
      const translations = {
        en: {
          save: "Save",
          backToGame: "Back to Game",
          updateSuccess: "Profile updated successfully",
          updateFail: "Username already taken",
          serverError: "Server error",
        },
        ms: {
          save: "Simpan",
          backToGame: "Kembali ke Permainan",
          updateSuccess: "Profil berjaya dikemas kini",
          updateFail: "Nama pengguna telah digunakan",
          serverError: "Ralat pelayan",
        },
        zh: {
          save: "保存",
          backToGame: "返回游戏",
          updateSuccess: "个人资料更新成功",
          updateFail: "用户名已被使用",
          serverError: "服务器错误",
        },
      };

      function getLang() {
        return sessionStorage.getItem("gameLang") || "en";
      }

      function t(key) {
        return translations[getLang()][key] || key;
      }

      function applyLanguage() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
      }

      applyLanguage();

      /* =========================
         Existing Logic
      ========================= */
      const usernameInput = document.getElementById("usernameInput");
      const passwordInput = document.getElementById("passwordInput");
      const editUsername = document.getElementById("editUsername");
      const saveBtn = document.getElementById("saveBtn");
      const togglePassword = document.getElementById("togglePassword");
      const alertBox = document.getElementById("alertBox");
      const backBtn = document.getElementById("backBtn");
      const currentAvatar = document.getElementById("currentAvatar");
      const avatarOverlay = document.getElementById("avatarOverlay");
      const avatarGrid = document.getElementById("avatarGrid");
      const popSound = document.getElementById("popSound");

      const avatars = [
        "WhiteMale",
        "BlackMale",
        "AsianMale",
        "NormalMale",
        "WhiteFemale",
        "BlackFemale",
        "AsianFemale",
        "IndianFemale",
      ];

      if (!sessionStorage.getItem("previousPage")) {
        sessionStorage.setItem(
          "previousPage",
          document.referrer || "/Pages/Homepage.html"
        );
      }

      let selectedPicture =
        sessionStorage.getItem("profilepicture") || "NormalMale";
      currentAvatar.src = `../ProfilePictures/${selectedPicture}.png`;
      usernameInput.value = sessionStorage.getItem("player_name") || "Player";
      passwordInput.value =
        sessionStorage.getItem("player_password") || "password";

      editUsername.onclick = () => {
        usernameInput.classList.toggle("editable");
        passwordInput.classList.toggle("editable");
        usernameInput.focus();
      };

      togglePassword.onclick = () => {
        passwordInput.type =
          passwordInput.type === "password" ? "text" : "password";
        togglePassword.classList.toggle("bi-eye-slash-fill");
      };

      currentAvatar.onclick = () => {
        avatarGrid.innerHTML = "";
        avatarOverlay.style.display = "flex";
        avatars.forEach((a, i) => {
          const img = document.createElement("img");
          img.src = `../ProfilePictures/${a}.png`;
          img.className = "avatar-choice";
          img.onclick = () => {
            selectedPicture = a;
            sessionStorage.setItem("profilepicture", a);
            currentAvatar.src = img.src;
            avatarOverlay.style.display = "none";
          };
          avatarGrid.appendChild(img);
          setTimeout(() => {
            img.style.transform = "scale(1)";
            popSound.currentTime = 0;
            popSound.play();
          }, i * 120);
        });
      };

      saveBtn.onclick = () => {
        const fd = new FormData();
        fd.append("username", usernameInput.value.trim());
        fd.append("password", passwordInput.value.trim());
        fd.append("profilepicture", selectedPicture);

        fetch("../Logic/edit_profile.php", { method: "POST", body: fd })
          .then((r) => r.json())
          .then((d) => {
            showAlert(
              d.status === "ok" ? t("updateSuccess") : t("updateFail"),
              d.status === "ok" ? "success" : "error"
            );
          })
          .catch(() => showAlert(t("serverError"), "error"));
      };

      function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = `alert ${type}`;
        alertBox.style.display = "block";
        setTimeout(() => (alertBox.style.display = "none"), 3000);
      }

      backBtn.onclick = () => {
        window.location.href =
          sessionStorage.getItem("previousPage") || "/Pages/Homepage.html";
      };
    </script>
  </body>
</html>
