<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="../CSS/sidebar.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Luckiest Guy", cursive;
        overflow: hidden;
      }
      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 60vh;
        text-align: center;
        color: white;
      }
      .language-btn {
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid white;
        color: white;
        font-size: 2rem;
        margin: 10px;
        padding: 10px 25px;
        cursor: pointer;
        border-radius: 12px;
        font-family: "Luckiest Guy", cursive;
        transition: transform 0.3s, background 0.3s;
      }
      .language-btn:hover {
        transform: scale(1.2);
        background: rgba(255, 255, 255, 0.2);
      }
      .btn-primary {
        background: none;
        border: none;
        color: white;
        font-size: 4rem;
        cursor: pointer;
        transition: 0.3s;
        font-family: "Luckiest Guy", cursive;
        text-decoration: underline;
        margin-top: 30px;
      }
      .btn-primary:hover {
        transform: scale(1.3);
      }
      #pickLangText {
        font-size: 3rem;
        font-family: "Luckiest Guy", cursive;
        color: black;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <video id="bgVideo" class="background-video" loop playsinline muted>
      <source src="../Animations/Homepage.mp4" type="video/mp4" />
    </video>

    <div class="content">
      <h1 id="pickLangText">Please pick a language</h1>
      <div id="languageOptions">
        <button class="language-btn" data-lang="en">English</button>
        <button class="language-btn" data-lang="ms">Malay</button>
        <button class="language-btn" data-lang="zh">中文</button>
      </div>

      <button
        id="playBtn"
        class="btn btn-primary"
        onclick="startGame()"
        style="display: none"
      >
        PLAY
      </button>
    </div>

    <script>
      const video = document.getElementById("bgVideo");
      video.play();

      let PLAYER_NAME = sessionStorage.getItem("player_name");
      if (!PLAYER_NAME) {
        alert("No user logged in");
        window.location.href = "/Pages/Login.html";
      }

      const languageButtons = document.querySelectorAll(".language-btn");
      const playBtn = document.getElementById("playBtn");
      const pickLangText = document.getElementById("pickLangText");

      // Language selection
      languageButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const chosenLang = btn.getAttribute("data-lang");
          sessionStorage.setItem("gameLang", chosenLang);

          // Update the PLAY button text based on selected language
          const playText = {
            en: "PLAY",
            ms: "MAIN",
            zh: "开始",
          };
          playBtn.textContent = playText[chosenLang];
          playBtn.style.display = "block";

          // Optionally hide language buttons after selection
          document.getElementById("languageOptions").style.display = "none";
          pickLangText.textContent = "Language selected!";
        });
      });

      function startGame() {
        // Redirect to start.php to generate a new singleplayer session
        window.location.href = "../Logic/start.php";
      }
    </script>

    <div id="sidebarPlaceholder"></div>

    <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("/Logic/sidebar.php")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const profilePic = document.getElementById("profilePic"); // now it exists
          if (profilePic) {
            profilePic.addEventListener("click", () => {
              // store the current page URL
              sessionStorage.setItem("previousPage", window.location.href);

              // redirect to edit profile page
              window.location.href = "/Pages/Edit_Profile.html";
            });
          }

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
  </body>
</html>
