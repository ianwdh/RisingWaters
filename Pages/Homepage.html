<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Luckiest Guy", cursive;
        overflow: hidden;
      }
      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 75vh;
        text-align: center;
        color: white;
      }
      .btn-primary {
        background: none;
        border: none;
        color: white;
        font-size: 4rem;
        cursor: pointer;
        transition: 0.3s;
        font-family: "Luckiest Guy", cursive;
        text-decoration: underline;
      }
      .btn-primary:hover {
        transform: scale(1.3);
      }
    </style>
  </head>
  <body>
    <video id="bgVideo" class="background-video" loop playsinline muted>
      <source src="../Animations/Homepage.mp4" type="video/mp4" />
    </video>

    <div class="content">
      <button id="playBtn" class="btn btn-primary" onclick="startGame()">
        PLAY
      </button>
    </div>

    <script>
      const video = document.getElementById("bgVideo");
      video.play();

      let PLAYER_NAME = sessionStorage.getItem("player_name");
      if (!PLAYER_NAME) {
        alert("No user logged in");
        window.location.href = "/Pages/Login.html";
      }

      function startGame() {
        // Redirect to start.php to generate a new singleplayer session
        window.location.href = "../Logic/start.php";
      }
    </script>

    <div id="sidebarPlaceholder"></div>

    <script>
      fetch("sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore(); // fetch score when sidebar opens
          });

          // Quit button
          const quitBtn = sidebar.querySelector("#quitGameBtn");
          quitBtn.addEventListener("click", () => {
            if (confirm("Are you sure you want to quit?")) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php") // adjust path as needed
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          // Optional: auto-refresh every 5 seconds
          setInterval(fetchScore, 5000);
        });
    </script>
  </body>
</html>
