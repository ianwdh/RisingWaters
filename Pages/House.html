<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="../CSS/sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }
      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(10, 10, 10, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        z-index: 10;
        transition: opacity 1.5s ease;
        color: white;
        text-align: center;
        text-shadow: 0px 0px 10px rgba(0, 0, 0, 0.9);
      }
      .overlay.visible {
        opacity: 1;
      }
      .overlay h1 {
        font-size: 2.5rem;
        margin-bottom: 30px;
      }
      .arrow-button {
        position: absolute;
        top: 50%;
        right: 30px;
        transform: translateY(-50%) scale(0.9);
        font-size: 4rem;
        color: white;
        text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
        cursor: pointer;
        opacity: 0;
        transition: transform 0.3s ease, color 0.3s ease, opacity 1s ease;
      }
      .arrow-button:hover {
        color: #73ff00;
      }
      .arrow-button.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <video class="background-video" autoplay playsinline id="bgVideo">
      <source src="../Animations/House.mp4" type="video/mp4" />
    </video>

    <div class="overlay" id="overlay">
      <h1 id="typewriter"></h1>
      <div class="arrow-button" id="arrowBtn" onclick="goNext()">
        <i class="bi bi-arrow-right-circle-fill"></i>
      </div>
    </div>

    <script>
      const video = document.getElementById("bgVideo");
      const overlay = document.getElementById("overlay");
      const typewriterEl = document.getElementById("typewriter");
      const arrowBtn = document.getElementById("arrowBtn");

      let PLAYER_NAME = sessionStorage.getItem("player_name");
      let LANGUAGE = sessionStorage.getItem("gameLang") || "en";

      if (!PLAYER_NAME) {
        alert("No user logged in");
        window.location.href = "/Pages/Login.html";
      }

      // Pre-generated scene text by language
      const SCENE_TEXT = {
        en: "Heavy rain has been looming for days.",
        ms: "Hujan lebat telah berlarutan selama beberapa hari.",
        zh: "几天来一直下着大雨。",
      };

      const text = SCENE_TEXT[LANGUAGE] || SCENE_TEXT.en;

      let index = 0;
      const typewriterSound = new Audio("../Sound/typewriter.wav");
      typewriterSound.loop = true;

      function typeWriter() {
        if (index < text.length) {
          typewriterSound.currentTime = 0;
          typewriterSound.play();
          typewriterEl.textContent += text.charAt(index);
          index++;
          setTimeout(typeWriter, 50);
        } else {
          typewriterSound.pause();
          typewriterSound.currentTime = 0;
          arrowBtn.classList.add("show");
        }
      }

      video.addEventListener("ended", () => {
        overlay.classList.add("visible");
        setTimeout(() => {
          typewriterSound.play();
          typeWriter();
        }, 500);
      });

      function goNext() {
        // Pass language to next page via sessionStorage
        window.location.href = "Scene1.html";
      }
    </script>

    <div id="sidebarPlaceholder"></div>

    <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("/Logic/sidebar.php")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const profilePic = document.getElementById("profilePic"); // now it exists
          if (profilePic) {
            profilePic.addEventListener("click", () => {
              // store the current page URL
              sessionStorage.setItem("previousPage", window.location.href);

              // redirect to edit profile page
              window.location.href = "/Pages/Edit_Profile.html";
            });
          }

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
  </body>
</html>
