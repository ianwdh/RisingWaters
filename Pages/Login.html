<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Login</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Luckiest Guy", cursive;
        font-size: 1.2rem;
        overflow: hidden;
      }
      .background-video {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      .card {
        background: #fff;
        color: #000;
        width: 350px;
        height: 430px;
        border: 2px solid #000;
        border-radius: 20px;
        padding: 1.5rem;
        display: grid;
        grid-template-rows: auto 1fr;
        text-align: center;
      }
      .form-control {
        border: 2px solid #000;
        font-size: 1.3rem;
        text-align: center;
        border-radius: 12px;
        font-family: "Luckiest Guy", cursive;
        width: 80%;
        background: #fff;
        padding: 10px 0;
        margin: 0 auto 1rem;
      }
      .btn-primary {
        background: #007bff;
        border: none;
        font-size: 1.4rem;
        font-family: "Luckiest Guy", cursive;
        padding: 12px;
        border-radius: 12px;
        color: #fff;
        width: 100%;
      }
      .btn-primary:hover {
        background: #28a745;
        transform: scale(1.05);
      }
      .hover-green {
        color: #007bff;
        text-decoration: underline;
      }
      .hover-green:hover {
        color: #28a745;
      }
      #alertBox {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 20px;
        border-radius: 8px;
        display: none;
        z-index: 9999;
        font-weight: bold;
        font-family: "Luckiest Guy", cursive;
        color: #fff;
      }
      #alertBox.error {
        background: #dc3545;
      }
      #alertBox.success {
        background: #28a745;
      }
    </style>
  </head>
  <body>
    <video class="background-video" autoplay loop muted playsinline>
      <source src="../Animations/Homepage.mp4" type="video/mp4" />
    </video>

    <div id="alertBox"></div>

    <div class="card">
      <h3>Login Form</h3>
      <form
        id="loginForm"
        style="display: grid; grid-template-rows: 1fr auto; gap: 0.5rem"
      >
        <div style="align-self: start">
          <label class="form-label">Username:</label>
          <input type="text" class="form-control" name="username" required />
          <label class="form-label">Password:</label>
          <input
            type="password"
            class="form-control"
            name="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
      <p style="margin-top: 10px; font-size: 1rem">
        Not registered?
        <a href="register.html" class="hover-green">Register here</a>
      </p>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const alertBox = document.getElementById("alertBox");

      function showAlert(message, type) {
        alertBox.textContent = message;
        alertBox.className = type === "error" ? "error" : "success";
        alertBox.style.display = "block";
        setTimeout(() => {
          alertBox.style.display = "none";
        }, 3000);
      }

      // Check if redirected from registration
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("registered") === "1") {
        showAlert("Registered successfully!", "success");
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = form.username.value;
        const password = form.password.value;

        fetch("/Logic/login.php", {
          method: "POST",
          body: new URLSearchParams({ username, password }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "ok") {
              sessionStorage.setItem("player_name", data.username);
              sessionStorage.setItem("player_id", data.player_id); // store player_id
              showAlert("Login successfully!", "success");
              setTimeout(() => {
                window.location.href = "/Pages/Homepage.html";
              }, 1000);
            } else {
              showAlert(
                data.message || "Incorrect username and/or password.",
                "error"
              );
            }
          })
          .catch(() => showAlert("Server error.", "error"));
      });
    </script>
  </body>
</html>
