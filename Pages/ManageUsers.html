<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Users</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      body {
        margin: 0;
        font-family: "Luckiest Guy", cursive;
        background: #222;
        color: white;
        padding: 20px;
      }

      h1 {
        font-family: "Luckiest Guy", cursive;
        margin-bottom: 20px;
        text-align: center;
      }

      .background-video {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      .alert {
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 1.2rem;
        display: none;
        margin-bottom: 15px;
        max-width: 800px;
        text-align: center;
        margin-left: auto;
        margin-right: auto;
      }

      .alert.success {
        background: #4caf50;
        color: white;
      }
      .alert.error {
        background: #f44336;
        color: white;
      }

      .table-container {
        max-width: 800px;
        margin: 0 auto 20px auto;
        overflow-y: auto;
        max-height: 600px; /* bigger list */
        background: rgba(0, 0, 0, 0.85);
        border-radius: 10px;
        padding: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #555;
        text-align: center;
      }

      th {
        background: #3498db;
      }

      td button {
        font-family: "Luckiest Guy", cursive;
        padding: 5px 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        margin: 2px;
      }

      .editBtn {
        background: #00ff00;
        color: black;
      }
      .deleteBtn {
        background: #f44336;
        color: white;
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 15px;
      }

      .pagination button {
        font-family: "Luckiest Guy", cursive;
        padding: 5px 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #3498db;
        color: white;
        transition: 0.3s;
      }

      .pagination button:hover {
        background: #00ff00;
        color: black;
      }

      #backBtn {
        position: fixed;
        bottom: 20px;
        left: 20px;
        font-family: "Luckiest Guy", cursive;
        font-size: 1.5rem;
        padding: 10px 20px;
        border-radius: 12px;
        border: none;
        background: #3498db;
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }

      #backBtn:hover {
        background: #00ff00;
        color: black;
      }

      h1{
        color: black;
      }
    </style>
  </head>

  <body>
    <h1>Manage Users</h1>

    <!-- Video Background -->
    <video class="background-video" autoplay loop muted playsinline>
      <source src="../Animations/Homepage.mp4" type="video/mp4" />
    </video>

    <!-- Audio Background -->
    <audio autoplay loop>
      <source src="../Animations/Homepage.mp3" type="audio/mpeg" />
    </audio>

    <div class="alert" id="alertBox"></div>

    <div class="table-container">
      <table id="usersTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Usertype</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>

    <button id="backBtn" onclick="window.location.href='AdminHomepage.html'">
      Back
    </button>

    <script>
      const alertBox = document.getElementById("alertBox");
      let currentPage = 1;

      // Fetch users
      function loadUsers(page = 1) {
        fetch(`../Logic/manage_users.php?page=${page}`)
          .then((r) => r.json())
          .then((data) => {
            const tbody = document.querySelector("#usersTable tbody");
            tbody.innerHTML = "";

            data.users.forEach((user) => {
              const tr = document.createElement("tr");

              const usernameTd = document.createElement("td");
              usernameTd.textContent = user.username;

              const usertypeTd = document.createElement("td");
              usertypeTd.textContent = user.usertype;

              const editTd = document.createElement("td");
              const editBtn = document.createElement("button");
              editBtn.className = "editBtn";
              editBtn.textContent = "Edit";
              editBtn.onclick = () =>
                editUser(user.id, user.username, user.usertype);
              editTd.appendChild(editBtn);

              const deleteTd = document.createElement("td");
              const deleteBtn = document.createElement("button");
              deleteBtn.className = "deleteBtn";
              deleteBtn.textContent = "Delete";
              deleteBtn.onclick = () => deleteUser(user.id);
              deleteTd.appendChild(deleteBtn);

              tr.appendChild(usernameTd);
              tr.appendChild(usertypeTd);
              tr.appendChild(editTd);
              tr.appendChild(deleteTd);
              tbody.appendChild(tr);
            });

            // Pagination
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";
            for (let i = 1; i <= data.totalPages; i++) {
              const btn = document.createElement("button");
              btn.textContent = i;
              if (i === page) btn.style.background = "#00ff00";
              btn.onclick = () => {
                currentPage = i;
                loadUsers(i);
              };
              pagination.appendChild(btn);
            }
          });
      }

      // Edit user
      function editUser(id, username, usertype) {
        const newUsername = prompt("Enter new username:", username);
        if (!newUsername) return;
        const newUsertype = prompt("Enter new usertype:", usertype);
        if (!newUsertype) return;

        const fd = new FormData();
        fd.append("action", "edit");
        fd.append("id", id);
        fd.append("username", newUsername);
        fd.append("usertype", newUsertype);

        fetch("../Logic/manage_users.php", { method: "POST", body: fd })
          .then((r) => r.json())
          .then((d) => {
            if (d.status === "ok") showAlert("Updated successfully", "success");
            else if (d.status === "taken")
              showAlert("Username already taken", "error");
            else showAlert("Server error", "error");
            loadUsers(currentPage);
          });
      }

      // Delete user
      function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this user?")) return;
        const fd = new FormData();
        fd.append("action", "delete");
        fd.append("id", id);

        fetch("../Logic/manage_users.php", { method: "POST", body: fd })
          .then((r) => r.json())
          .then((d) => {
            if (d.status === "ok") showAlert("Deleted successfully", "success");
            else showAlert("Server error", "error");
            loadUsers(currentPage);
          });
      }

      function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = `alert ${type}`;
        alertBox.style.display = "block";
        setTimeout(() => (alertBox.style.display = "none"), 3000);
      }

      // Load initial users
      loadUsers();
    </script>
  </body>
</html>
