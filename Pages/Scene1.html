<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }

      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 50px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.8s ease;
        color: white;
        text-align: center;
      }

      .overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      #countdownTimer {
        position: fixed;
        top: 20px;
        right: 30px;
        font-size: 4rem;
        color: white;
        opacity: 0;
        transition: opacity 0.5s ease;
        text-shadow: 3px 3px 10px black;
        z-index: 9999;
      }

      .timer-warning {
        color: red !important;
        animation: flash 0.6s infinite;
      }

      @keyframes flash {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
        100% {
          opacity: 1;
        }
      }

      #deathScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: red;
        font-size: 4rem;
        font-weight: bold;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease;
        z-index: 999999;
        text-align: center;
      }

      #deathScreen button {
        margin-top: 20px;
        font-size: 2rem;
        padding: 10px 30px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: red;
        color: white;
        font-family: "Luckiest Guy";
        transition: background 0.3s ease;
      }

      #deathScreen button:hover {
        background: green;
      }

      #safetyMessage {
        font-size: 1.5rem;
        margin-bottom: 20px;
      }

      #mainMessage {
        font-size: 2rem;
        max-width: 80%;
        margin-bottom: 40px;
      }

      .icon-container {
        display: grid;
        grid-template-columns: repeat(2, auto);
        grid-gap: 20px;
        justify-items: center;
        align-items: center;
      }

      .icon-container img {
        width: 200px;
        height: auto;
        opacity: 0;
        transform: scale(0.5);
        transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s ease;
        border-radius: 50%;
        cursor: pointer;
      }

      .icon-container img.show {
        opacity: 1;
        transform: scale(1);
      }

      .icon-container img:hover {
        transform: scale(1.1);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>

  <body>
    <video class="background-video" autoplay playsinline>
      <source src="../Animations/Scene1.mp4" type="video/mp4" />
    </video>

    <div id="countdownTimer">10</div>

    <div id="deathScreen">
      <span id="deathText">YOU RAN OUT OF TIME!</span>
      <button id="retryBtn">RETRY</button>
    </div>

    <div class="overlay" id="overlay">
      <div id="safetyMessage"></div>
      <h1 id="mainMessage"></h1>
      <div class="icon-container">
        <img src="../Icons/Ladder.png" alt="Ladder" />
        <img src="../Icons/Car.png" alt="Car" />
        <img src="../Icons/EmergencyBag.png" alt="Emergency Bag" />
        <img src="../Icons/Money.png" alt="Money" />
      </div>
    </div>

    <script>
      const video = document.querySelector(".background-video");
      const overlay = document.getElementById("overlay");
      const icons = document.querySelectorAll(".icon-container img");
      const mainMessageEl = document.getElementById("mainMessage");
      const retryBtn = document.getElementById("retryBtn");
      const deathTextEl = document.getElementById("deathText");

      const LANGUAGE = sessionStorage.getItem("gameLang") || "en";

      const TEXT = {
        en: {
          main: "The water rises quickly in your kampung home. You have only seconds to act. What do you do?",
          death: "YOU RAN OUT OF TIME!",
          retry: "RETRY",
        },
        ms: {
          main: "Air naik dengan cepat di rumah kampung anda. Anda hanya mempunyai beberapa saat untuk bertindak. Apa yang anda lakukan?",
          death: "MASA ANDA TELAH HABIS!",
          retry: "CUBA LAGI",
        },
        zh: {
          main: "洪水迅速淹没你的甘榜住宅。你只有几秒钟可以行动。你会怎么做？",
          death: "时间已用完！",
          retry: "重试",
        },
      };

      const mainText = TEXT[LANGUAGE].main;
      deathTextEl.textContent = TEXT[LANGUAGE].death;
      retryBtn.textContent = TEXT[LANGUAGE].retry;

      let mainIndex = 0;

      const typewriterSound = new Audio("../Sound/typewriter.wav");
      typewriterSound.loop = true;

      function typeWriterMain() {
        if (mainIndex < mainText.length) {
          mainMessageEl.textContent += mainText.charAt(mainIndex);
          mainIndex++;
          setTimeout(typeWriterMain, 40);
        } else {
          typewriterSound.pause();
          typewriterSound.currentTime = 0;

          icons.forEach((icon, index) => {
            setTimeout(() => {
              icon.classList.add("show");
              const popSound = new Audio("../Sound/icon.mp3");
              popSound.play();
            }, index * 400);
          });

          startCountdown();
        }
      }

      function startCountdown() {
        const timerEl = document.getElementById("countdownTimer");
        let timeLeft = 10;

        timerEl.style.opacity = 1;
        timerEl.textContent = timeLeft;

        const countdown = setInterval(() => {
          timeLeft--;
          timerEl.textContent = timeLeft;

          if (timeLeft <= 3 && timeLeft > 0) {
            timerEl.classList.add("timer-warning");
          }

          if (timeLeft <= 0) {
            clearInterval(countdown);
            triggerDeathScene();
          }
        }, 1000);
      }

      function triggerDeathScene() {
        const screen = document.getElementById("deathScreen");
        screen.style.opacity = 1;
        screen.style.pointerEvents = "auto";
      }

      icons.forEach((icon, index) => {
        icon.addEventListener("click", () => {
          const pages = [
            "Scene1ALadder.html",
            "Scene1ACar.html",
            "Scene1AEmergencyBag.html",
            "Scene1AMoney.html",
          ];
          window.location.href = pages[index];
        });
      });

      retryBtn.addEventListener("click", () => {
        fetch("../Logic/score.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "action=retry",
        })
          .then((response) => response.json())
          .then(() => {
            window.location.href = "Scene1.html";
          })
          .catch(() => {
            window.location.href = "Scene1.html";
          });
      });

      video.addEventListener("ended", () => {
        overlay.classList.add("visible");
        setTimeout(() => {
          typewriterSound.play();
          typeWriterMain();
        }, 1500);
      });
    </script>

    <div id="sidebarPlaceholder"></div>

    <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
  </body>
</html>
