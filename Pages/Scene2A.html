<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="../CSS/sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }

      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -3;
      }

      #countdown {
        position: fixed;
        top: 20px;
        right: 20px;
        color: white;
        font-size: 4rem;
        text-shadow: 2px 2px 8px black;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .danger-flash {
        animation: flashRed 0.6s ease-in-out infinite;
      }

      @keyframes flashRed {
        0% {
          color: white;
          opacity: 1;
        }
        50% {
          color: red;
          opacity: 0.4;
        }
        100% {
          color: white;
          opacity: 1;
        }
      }

      #deathScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        color: red;
        font-size: 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.6s ease;
        z-index: 20;
      }

      .retry-btn {
        margin-top: 30px;
        padding: 12px 26px;
        font-size: 1.6rem;
        background: red;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-family: "Luckiest Guy", cursive;
      }

      .retry-btn:hover {
        background: green;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 50px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.8s ease;
        color: white;
        text-align: center;
      }

      .overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      #mainMessage {
        font-size: 2rem;
        max-width: 80%;
        margin-bottom: 40px;
      }

      .icon-container {
        display: grid;
        grid-template-columns: repeat(2, auto);
        grid-gap: 20px;
        justify-items: center;
        align-items: center;
      }

      .icon-container img {
        width: 200px;
        opacity: 0;
        transform: scale(0.5);
        transition: opacity 0.4s ease, transform 0.4s ease;
        cursor: pointer;
        border-radius: 50%;
      }

      .icon-container img.show {
        opacity: 1;
        transform: scale(1);
      }

      .icon-container img:hover {
        transform: scale(1.1);
      }
    </style>
  </head>

  <body>
    <video class="background-video" autoplay playsinline>
      <source src="../Animations/Scene2A.mp4" type="video/mp4" />
    </video>

    <div id="countdown">10</div>

    <div id="deathScreen">
      <div id="deathText"></div>
      <button class="retry-btn" id="retryDeath">Retry</button>
    </div>

    <div class="overlay" id="overlay">
      <h1 id="mainMessage"></h1>

      <div class="icon-container">
        <img src="../Icons/Tree.png" alt="Tree" />
        <img src="../Icons/Valuables.png" alt="Valuables" />
        <img src="../Icons/Cloth.png" alt="Cloth" />
        <img src="../Icons/Phone.png" alt="Phone" />
      </div>
    </div>

    <script>
      const video = document.querySelector(".background-video");
      const overlay = document.getElementById("overlay");
      const icons = document.querySelectorAll(".icon-container img");
      const mainMessage = document.getElementById("mainMessage");

      const countdownEl = document.getElementById("countdown");
      const deathScreen = document.getElementById("deathScreen");
      const retryDeath = document.getElementById("retryDeath");
      const deathText = document.getElementById("deathText");

      const LANGUAGE = sessionStorage.getItem("gameLang") || "en";

      const TEXT = {
        en: {
          main:
            "You are now on the roof. The ground floor is flooded. What do you do?",
          death: "YOU RAN OUT OF TIME!",
          retry: "Retry",
        },
        ms: {
          main:
            "Anda kini berada di atas bumbung. Tingkat bawah telah ditenggelami air. Apa yang anda lakukan?",
          death: "MASA ANDA TELAH HABIS!",
          retry: "Cuba Semula",
        },
        zh: {
          main:
            "你现在在屋顶上。一楼已经被洪水淹没。你该怎么办？",
          death: "你已经没有时间了！",
          retry: "重试",
        },
      };

      deathText.textContent = TEXT[LANGUAGE].death;
      retryDeath.textContent = TEXT[LANGUAGE].retry;

      let timeLeft = 10;
      let timerStarted = false;
      let timer = null;

      function showDeathScreen() {
        deathScreen.style.visibility = "visible";
        deathScreen.style.opacity = "1";

        fetch("../Logic/score.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "action=retry",
        });
      }

      retryDeath.addEventListener("click", () => {
        window.location.href = "Scene2A.html";
      });

      function startTimer() {
        if (timerStarted) return;
        timerStarted = true;

        countdownEl.style.opacity = "1";

        timer = setInterval(() => {
          timeLeft--;
          countdownEl.textContent = timeLeft;

          if (timeLeft === 3) {
            countdownEl.classList.add("danger-flash");
          }

          if (timeLeft <= 0) {
            clearInterval(timer);
            showDeathScreen();
          }
        }, 1000);
      }

      const mainText = TEXT[LANGUAGE].main;
      let index = 0;

      const typeSound = new Audio("../Sound/typewriter.wav");
      typeSound.loop = true;

      function typeWriter() {
        if (index < mainText.length) {
          mainMessage.textContent += mainText.charAt(index);
          index++;
          setTimeout(typeWriter, 40);
        } else {
          typeSound.pause();

          icons.forEach((icon, i) => {
            setTimeout(() => {
              icon.classList.add("show");
              new Audio("../Sound/icon.mp3").play();

              if (i === icons.length - 1) {
                setTimeout(startTimer, 500);
              }
            }, i * 400);
          });
        }
      }

      video.addEventListener("ended", () => {
        overlay.classList.add("visible");
        setTimeout(() => {
          typeSound.play();
          typeWriter();
        }, 1200);
      });

      const pages = [
        "Scene2ATree.html",
        "Scene2AValuables.html",
        "Scene2ACloth.html",
        "Scene2APhone.html",
      ];

      icons.forEach((icon, index) => {
        icon.addEventListener("click", () => {
          window.location.href = pages[index];
        });
      });
    </script>
  </body>

  <div id="sidebarPlaceholder"></div>

  <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("/Logic/sidebar.php")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const profilePic = document.getElementById("profilePic"); // now it exists
          if (profilePic) {
            profilePic.addEventListener("click", () => {
              // store the current page URL
              sessionStorage.setItem("previousPage", window.location.href);

              // redirect to edit profile page
              window.location.href = "/Pages/Edit_Profile.html";
            });
          }

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
</html>
