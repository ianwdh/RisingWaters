<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }

      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
      }

      /* Overlay */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 2;
        opacity: 0;
        visibility: hidden;
        display: flex;
        flex-direction: column;
        padding: 20px;
        transition: opacity 0.8s ease;
      }

      .overlay.show {
        opacity: 1;
        visibility: visible;
      }

      /* Top bar: icon + message */
      .top-bar {
        display: flex;
        align-items: center;
        color: white;
        font-size: 1.2rem;
        gap: 12px;
      }

      /* Center message */
      .center-message {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: white;
        text-align: center;
        max-width: 80%;
        margin: 0 auto;
        text-shadow: 2px 2px 4px black;
        min-height: 3em;
      }

      /* Retry button larger */
      .retry-btn {
        margin: 50px auto;
        padding: 14px 28px;
        font-size: 1.6rem;
        background: crimson;
        border: none;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font-family: "Luckiest Guy", cursive;
      }

      .retry-btn:hover {
        background: darkred;
      }

      /* Wave rising effect */
      .wave {
        position: fixed;
        bottom: -100%;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("../Images/wave.png") no-repeat center bottom;
        background-size: cover;
        z-index: 1;
        animation-fill-mode: forwards;
      }

      .wave.animate {
        animation: waveRise 1.5s ease-out forwards;
      }

      @keyframes waveRise {
        0% {
          bottom: -100%;
        }
        100% {
          bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background video -->
    <video class="background-video" autoplay playsinline>
      <source src="../Animations/Scene2BDog.mp4" type="video/mp4" />
    </video>

    <!-- Wave image -->
    <div class="wave" id="wave"></div>

    <!-- Dark overlay -->
    <div class="overlay" id="overlay">
      <div class="top-bar">
        <i class="bi bi-ban" style="font-size: 2rem"></i>
        <span id="message1"></span>
      </div>
      <div class="center-message" id="message2"></div>
      <button
        class="retry-btn"
        id="retryBtn"
        onclick="window.location.href='Scene2B.html'"
      >
        Retry
      </button>
    </div>

    <script>
      const video = document.querySelector(".background-video");
      const wave = document.getElementById("wave");
      const overlay = document.getElementById("overlay");
      const msg1Element = document.getElementById("message1");
      const msg2Element = document.getElementById("message2");
      const retryBtn = document.getElementById("retryBtn");

      // ================= LANGUAGE SYSTEM =================
      const lang = sessionStorage.getItem("gameLang") || "en";

      const TEXT = {
        en: {
          message1: "In emergencies, it’s safest not to return for pets, as floodwaters rise quickly and can trap you. Focus on protecting yourself first so rescuers can later assist both you and your pet.",
          message2: "You went back to get your pet dog, however the floodwater quickly rose and swallowed the both of you.",
          retry: "Retry"
        },
        ms: {
          message1: "Dalam kecemasan, adalah paling selamat untuk tidak kembali mengambil haiwan peliharaan, kerana air banjir naik dengan cepat dan boleh menjerat anda. Fokus pada melindungi diri dahulu supaya penyelamat boleh membantu anda dan haiwan peliharaan kemudian.",
          message2: "Anda kembali untuk mendapatkan anjing peliharaan anda, namun air banjir dengan cepat naik dan menelan anda berdua.",
          retry: "Cuba Lagi"
        },
        zh: {
          message1: "在紧急情况下，返回去找宠物是最危险的，因为洪水上涨迅速，可能会困住你。先保护自己，以便救援人员稍后能帮助你和你的宠物。",
          message2: "你回去找你的宠物狗，但洪水迅速上涨，把你们俩吞没了。",
          retry: "重试"
        }
      };

      const message1 = TEXT[lang].message1;
      const message2 = TEXT[lang].message2;
      retryBtn.textContent = TEXT[lang].retry;
      // ====================================================

      const typewriterSound = new Audio("../Sound/typewriter.wav");
      typewriterSound.loop = true;

      function typeWriter(text, element, speed, callback) {
        let i = 0;
        element.textContent = "";

        typewriterSound.currentTime = 0;
        typewriterSound.play();

        function typing() {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(typing, speed);
          } else {
            typewriterSound.pause();
            typewriterSound.currentTime = 0;
            if (callback) callback();
          }
        }
        typing();
      }

      video.addEventListener("ended", () => {
        wave.classList.add("animate");
        setTimeout(() => {
          overlay.classList.add("show");
          typeWriter(message1, msg1Element, 30, () => {
            typeWriter(message2, msg2Element, 30);
          });
        }, 1500);
      });

      retryBtn.addEventListener("click", function () {
        fetch("../Logic/score.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "action=retry",
        })
          .then((response) => response.json())
          .then((data) => {
            console.log("Score update:", data);
            window.location.href = "Scene2B.html";
          })
          .catch((error) => {
            console.error("Error updating score:", error);
            window.location.href = "Scene2B.html";
          });
      });
    </script>
  </body>
  <div id="sidebarPlaceholder"></div>

  <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
</html>
