<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }
      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      #countdown {
        position: fixed;
        top: 20px;
        right: 20px;
        font-size: 4rem;
        color: white;
        text-shadow: 2px 2px 8px black;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 10;
      }
      .danger-flash {
        animation: flashRed 0.6s ease-in-out infinite;
      }
      @keyframes flashRed {
        0% {
          color: white;
          opacity: 1;
        }
        50% {
          color: red;
          opacity: 0.4;
        }
        100% {
          color: white;
          opacity: 1;
        }
      }
      #deathScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        color: red;
        font-size: 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.6s ease;
        z-index: 30;
      }
      .retry-btn {
        margin-top: 30px;
        padding: 12px 26px;
        font-size: 1.6rem;
        background: red;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-family: "Luckiest Guy", cursive;
      }
      .retry-btn:hover {
        background: green;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 50px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.8s ease;
        color: white;
        text-align: center;
        z-index: 5;
      }
      .overlay.visible {
        opacity: 1;
        visibility: visible;
      }
      #mainMessage {
        font-size: 2rem;
        max-width: 80%;
        margin-bottom: 40px;
      }
      .icon-container {
        display: grid;
        grid-template-columns: repeat(2, auto);
        grid-gap: 20px;
        justify-items: center;
        align-items: center;
      }
      .icon-container img {
        width: 200px;
        opacity: 0;
        transform: scale(0.5);
        transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s ease;
        border-radius: 50%;
        cursor: pointer;
      }
      .icon-container img.show {
        opacity: 1;
        transform: scale(1);
      }
      .icon-container img:hover {
        transform: scale(1.1);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <video class="background-video" autoplay playsinline>
      <source src="../Animations/Scene3B.mp4" type="video/mp4" />
    </video>

    <div id="countdown">10</div>

    <div id="deathScreen">
      <div id="deathText">YOU RAN OUT OF TIME!</div>
      <button class="retry-btn" id="retryDeath">Retry</button>
    </div>

    <div class="overlay" id="overlay">
      <h1 id="mainMessage"></h1>
      <div class="icon-container">
        <img src="../Icons/Explore.png" alt="Explore" />
        <img src="../Icons/Radio.png" alt="Radio" />
        <img src="../Icons/EmergencySupplies.png" alt="Emergency Supplies" />
        <img src="../Icons/Playing.png" alt="Playing" />
      </div>
    </div>

    <script>
      const video = document.querySelector(".background-video");
      const overlay = document.getElementById("overlay");
      const icons = document.querySelectorAll(".icon-container img");
      const mainMessage = document.getElementById("mainMessage");
      const countdownEl = document.getElementById("countdown");
      const deathScreen = document.getElementById("deathScreen");
      const retryDeath = document.getElementById("retryDeath");
      const deathText = document.getElementById("deathText");

      // Language setup
      const lang = sessionStorage.getItem("gameLang") || "en";

      const TEXT = {
        en: {
          main: "You reach the crowded but safe hall. What do you do?",
          death: "YOU RAN OUT OF TIME!",
          retry: "Retry"
        },
        ms: {
          main: "Anda sampai di dewan yang selamat dan sesak. Apa yang anda lakukan?",
          death: "MASA ANDA TAMAT!",
          retry: "Cuba Lagi"
        },
        zh: {
          main: "你到达了拥挤但安全的大厅。你会怎么做？",
          death: "时间到！",
          retry: "重试"
        },
      };

      mainMessage.textContent = "";
      deathText.textContent = TEXT[lang].death;
      retryDeath.textContent = TEXT[lang].retry;

      let timeLeft = 10;
      let timerStarted = false;
      let timer = null;

      function startTimer() {
        if (timerStarted) return;
        timerStarted = true;
        countdownEl.style.opacity = "1";

        timer = setInterval(() => {
          timeLeft--;
          countdownEl.textContent = timeLeft;
          if (timeLeft === 3) countdownEl.classList.add("danger-flash");
          if (timeLeft <= 0) {
            clearInterval(timer);
            showDeathScreen();
          }
        }, 1000);
      }

      function showDeathScreen() {
        deathScreen.style.visibility = "visible";
        deathScreen.style.opacity = "1";
        fetch("../Logic/score.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "action=retry",
        });
      }

      retryDeath.addEventListener("click", () => {
        window.location.href = "Scene3B.html";
      });

      let index = 0;
      const typewriterSound = new Audio("../Sound/typewriter.wav");
      typewriterSound.loop = true;

      function typeWriter() {
        if (index < TEXT[lang].main.length) {
          typewriterSound.currentTime = 0;
          typewriterSound.play();
          mainMessage.textContent += TEXT[lang].main.charAt(index);
          index++;
          setTimeout(typeWriter, 40);
        } else {
          typewriterSound.pause();
          icons.forEach((icon, i) => {
            setTimeout(() => {
              icon.classList.add("show");
              new Audio("../Sound/icon.mp3").play();
              if (i === icons.length - 1) setTimeout(startTimer, 400);
            }, i * 400);
          });
        }
      }

      video.addEventListener("ended", () => {
        overlay.classList.add("visible");
        setTimeout(typeWriter, 1500);
      });

      const pages = [
        "Scene3BExplore.html",
        "Scene3BRadio.html",
        "Scene3BEmergencySupplies.html",
        "Scene3BPlaying.html",
      ];

      icons.forEach((icon, i) => {
        icon.addEventListener("click", () => {
          window.location.href = pages[i];
        });
      });
    </script>

    <div id="sidebarPlaceholder"></div>
    <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
  </body>
</html>
