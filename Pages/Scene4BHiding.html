<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }

      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 2;
        opacity: 0;
        visibility: hidden;
        display: flex;
        flex-direction: column;
        padding: 20px;
        transition: opacity 0.8s ease;
      }

      .overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .top-bar {
        display: flex;
        align-items: center;
        color: white;
        font-size: 1.2rem;
        gap: 12px;
      }

      .center-message {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: white;
        text-align: center;
        max-width: 80%;
        margin: 0 auto;
        text-shadow: 2px 2px 4px black;
        min-height: 3em;
      }

      .retry-btn {
        margin: 50px auto;
        padding: 14px 28px;
        font-size: 1.6rem;
        background: crimson;
        border: none;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font-family: "Luckiest Guy", cursive;
      }

      .retry-btn:hover {
        background: darkred;
      }
    </style>
  </head>

  <body>
    <video class="background-video" autoplay playsinline>
      <source src="../Animations/Scene4BHiding.mp4" type="video/mp4" />
    </video>

    <div class="wave" id="wave"></div>

    <div class="overlay" id="overlay">
      <div class="top-bar">
        <i class="bi bi-ban" style="font-size: 2rem"></i>
        <span id="message1"></span>
      </div>
      <div class="center-message" id="message2"></div>
      <button class="retry-btn" id="retryBtn">Retry</button>
    </div>

    <script>
      const video = document.querySelector(".background-video");
      const wave = document.getElementById("wave");
      const overlay = document.getElementById("overlay");
      const msg1Element = document.getElementById("message1");
      const msg2Element = document.getElementById("message2");
      const retryBtn = document.getElementById("retryBtn");

      const lang = sessionStorage.getItem("gameLang") || "en";

      const TEXT = {
        en: {
          msg1: "In emergencies, staying focused is important—treating the situation lightly can cause you to miss your chance at safety.",
          msg2: "You start playing hide and seek while everyone boards the rescue helicopter, and they eventually left without you.",
          retry: "Retry",
        },
        ms: {
          msg1: "Dalam situasi kecemasan, kekal fokus adalah penting—bersikap sambil lewa boleh menyebabkan anda terlepas peluang untuk selamat.",
          msg2: "Anda bermain sorok-sorok sementara semua orang menaiki helikopter penyelamat, dan mereka akhirnya pergi tanpa anda.",
          retry: "Cuba Semula",
        },
        zh: {
          msg1: "在紧急情况下，保持专注非常重要——轻视情况可能会让你错失逃生的机会。",
          msg2: "你开始玩捉迷藏，而其他人已经登上救援直升机，最终他们离开了你。",
          retry: "重试",
        },
      };

      const message1 = TEXT[lang].msg1;
      const message2 = TEXT[lang].msg2;
      retryBtn.textContent = TEXT[lang].retry;

      const typewriterSound = new Audio("../Sound/typewriter.wav");
      typewriterSound.loop = true;

      function typeWriter(text, element, speed, callback) {
        let i = 0;
        element.textContent = "";

        typewriterSound.currentTime = 0;
        typewriterSound.play();

        function typing() {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(typing, speed);
          } else {
            typewriterSound.pause();
            typewriterSound.currentTime = 0;
            if (callback) callback();
          }
        }
        typing();
      }

      video.addEventListener("ended", () => {
        wave.classList.add("animate");
        setTimeout(() => {
          overlay.classList.add("show");
          typeWriter(message1, msg1Element, 30, () => {
            typeWriter(message2, msg2Element, 30);
          });
        }, 1500);
      });

      retryBtn.addEventListener("click", function () {
        fetch("../Logic/score.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body: "action=retry",
        }).finally(() => {
          window.location.href = "Scene4B.html";
        });
      });
    </script>
  </body>

  <div id="sidebarPlaceholder"></div>

  <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
</html>
