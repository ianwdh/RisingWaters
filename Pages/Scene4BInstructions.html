<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>

    <link rel="stylesheet" href="../CSS/sidebar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }

      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        opacity: 0;
        z-index: 10;
        transition: opacity 3s ease;
        color: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .flashbang {
        animation: flashbangEffect 3s ease forwards;
      }

      @keyframes flashbangEffect {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }

      .safety-bar {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        font-size: 1.5rem;
        opacity: 0;
        transition: opacity 1s ease;
      }

      .safety-bar.show {
        opacity: 1;
      }

      .safety-bar i {
        font-size: 2.5rem;
        color: black;
      }

      .overlay h1 {
        font-size: 2.5rem;
        margin: 0 auto;
        max-width: 80%;
        text-align: center;
      }

      .arrow-button {
        position: absolute;
        bottom: 350px;
        right: 80px;
        font-size: 4rem;
        color: black;
        cursor: pointer;
        opacity: 0;
        transition: opacity 1s ease;
      }

      .arrow-button.show {
        opacity: 1;
      }

      .arrow-button:hover {
        color: #73ff00;
      }
    </style>
  </head>

  <body>
    <!-- Background video -->
    <video class="background-video" autoplay playsinline id="bgVideo">
      <source src="../Animations/Scene4BInstructions.mp4" type="video/mp4" />
    </video>

    <!-- Overlay -->
    <div class="overlay" id="overlay">
      <div class="safety-bar" id="safetyBar">
        <i class="bi bi-lightbulb-fill"></i>
        <span id="safetyMessage"></span>
      </div>

      <h1 id="mainMessage"></h1>

      <div class="arrow-button" id="success_arrowBtn">
        <i class="bi bi-arrow-right-circle-fill"></i>
      </div>
    </div>

    <script>
      const video = document.getElementById("bgVideo");
      const overlay = document.getElementById("overlay");
      const safetyBar = document.getElementById("safetyBar");
      const safetyMessageEl = document.getElementById("safetyMessage");
      const mainMessageEl = document.getElementById("mainMessage");
      const success_arrowBtn = document.getElementById("success_arrowBtn");

      /* ================= LANGUAGE SETUP ================= */
      const lang = sessionStorage.getItem("language") || "English";

      const textContent = {
        English: {
          safety:
            "In emergencies, staying patient and trusting rescuers is often the safest choice.",
          main: "You follow the instructions and safely board the rescue helicopter.",
        },
        Malay: {
          safety:
            "Dalam situasi kecemasan, bersabar dan mempercayai penyelamat adalah pilihan paling selamat.",
          main: "Anda mengikuti arahan dan berjaya menaiki helikopter penyelamat dengan selamat.",
        },
        Chinese: {
          safety: "在紧急情况下，保持耐心并信任救援人员通常是最安全的选择。",
          main: "你按照指示行动，安全地登上了救援直升机。",
        },
      };

      const safetyText = textContent[lang].safety;
      const mainText = textContent[lang].main;

      let safetyIndex = 0;
      let mainIndex = 0;

      const typewriterSound = new Audio("../Sound/typewriter.wav");
      typewriterSound.loop = true;

      function typeWriterSafety() {
        typewriterSound.currentTime = 0;
        typewriterSound.play();

        function typeChar() {
          if (safetyIndex < safetyText.length) {
            safetyMessageEl.textContent += safetyText.charAt(safetyIndex++);
            setTimeout(typeChar, 40);
          } else {
            typewriterSound.pause();
            typewriterSound.currentTime = 0;
          }
        }
        typeChar();
      }

      function typeWriterMain() {
        typewriterSound.currentTime = 0;
        typewriterSound.play();

        function typeChar() {
          if (mainIndex < mainText.length) {
            mainMessageEl.textContent += mainText.charAt(mainIndex++);
            setTimeout(typeChar, 40);
          } else {
            typewriterSound.pause();
            typewriterSound.currentTime = 0;
            success_arrowBtn.classList.add("show");
          }
        }
        typeChar();
      }

      video.addEventListener("ended", () => {
        overlay.classList.add("flashbang");
        setTimeout(() => {
          overlay.style.opacity = 1;
          safetyBar.classList.add("show");
          setTimeout(typeWriterSafety, 200);
          setTimeout(typeWriterMain, 800);
        }, 800);
      });

      success_arrowBtn.addEventListener("click", () => {
        fetch("../Logic/score.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "action=success",
        }).finally(() => {
          window.location.href = "SceneBEnding.html";
        });
      });
    </script>
  </body>

  <!-- Sidebar -->
  <div id="sidebarPlaceholder"></div>

  <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("/Logic/sidebar.php")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const profilePic = document.getElementById("profilePic"); // now it exists
          if (profilePic) {
            profilePic.addEventListener("click", () => {
              // store the current page URL
              sessionStorage.setItem("previousPage", window.location.href);

              // redirect to edit profile page
              window.location.href = "/Pages/Edit_Profile.html";
            });
          }

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
</html>
