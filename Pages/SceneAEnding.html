<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rising Waters - Flood Safety Game</title>

    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Luckiest Guy", cursive;
      }

      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(10, 10, 10, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        z-index: 10;
        transition: opacity 1.5s ease;
        color: white;
        text-align: center;
        text-shadow: 0px 0px 10px rgba(0, 0, 0, 0.9);
      }

      .overlay.visible {
        opacity: 1;
      }

      .overlay h1 {
        font-size: 2.5rem;
        margin-bottom: 30px;
      }

      .end-btn {
        position: fixed;
        bottom: 100px;
        padding: 14px 28px;
        font-size: 1.6rem;
        background: rgb(0, 255, 98);
        border: none;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font-family: "Luckiest Guy", cursive;
      }

      .end-btn:hover {
        background: darkgreen;
      }
    </style>
  </head>

  <body>
    <!-- Background video -->
    <video class="background-video" autoplay playsinline id="bgVideo">
      <source src="../Animations/SceneAEnding.mp4" type="video/mp4" />
    </video>

    <!-- Ending overlay -->
    <div class="overlay" id="overlay">
      <h1 id="typewriter"></h1>
      <button class="end-btn" id="endBtn">End</button>
    </div>

    <script>
      const video = document.getElementById("bgVideo");
      const overlay = document.getElementById("overlay");
      const typewriterEl = document.getElementById("typewriter");
      const endBtn = document.getElementById("endBtn");

      /* ================= LANGUAGE SETUP ================= */
      const lang = sessionStorage.getItem("language") || "English";

      const textContent = {
        English: {
          endingText: "The rain finally subsides as you are finally safe.",
          endBtn: "End",
        },
        Malay: {
          endingText:
            "Hujan akhirnya reda dan anda kini berada dalam keadaan selamat.",
          endBtn: "Tamat",
        },
        Chinese: {
          endingText: "雨终于停了，你终于安全了。",
          endBtn: "结束",
        },
      };

      const text = textContent[lang].endingText;
      endBtn.textContent = textContent[lang].endBtn;

      let index = 0;

      const typewriterSound = new Audio("../Sound/typewriter.wav");
      typewriterSound.loop = true;

      function typeWriter() {
        if (index < text.length) {
          if (typewriterSound.paused) {
            typewriterSound.currentTime = 0;
            typewriterSound.play();
          }
          typewriterEl.textContent += text.charAt(index);
          index++;
          setTimeout(typeWriter, 50);
        } else {
          typewriterSound.pause();
          typewriterSound.currentTime = 0;
        }
      }

      video.addEventListener("ended", () => {
        overlay.classList.add("visible");
        setTimeout(typeWriter, 500);
      });

      endBtn.addEventListener("click", () => {
        window.location.href = "../Logic/finish.php";
      });
    </script>
  </body>

  <!-- Sidebar -->
  <div id="sidebarPlaceholder"></div>

  <script>
      /* =========================
  TRANSLATIONS & LANGUAGE SYSTEM
  ========================= */
      const translations = {
        en: {
          playerScoreLabel: "Player Score",
          quitGame: "Quit Game",
          quitConfirm: "Are you sure you want to quit?",
        },
        ms: {
          playerScoreLabel: "Skor Pemain",
          quitGame: "Keluar Permainan",
          quitConfirm: "Adakah anda pasti mahu keluar?",
        },
        zh: {
          playerScoreLabel: "玩家分数",
          quitGame: "退出游戏",
          quitConfirm: "你确定要退出吗？",
        },
      };

      function getText(key) {
        const lang = sessionStorage.getItem("gameLang") || "en";
        return translations[lang][key] || translations.en[key];
      }

      function applyLanguage() {
        const lang = sessionStorage.getItem("gameLang") || "en";

        // Update sidebar elements
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = translations[lang][key] || translations.en[key];
        });

        // Optional: update other elements on the page if needed
        // For example, update PLAY button if it exists
        const playBtn = document.getElementById("playBtn");
        if (playBtn) {
          const playText = { en: "PLAY", ms: "MAIN", zh: "开始" };
          playBtn.textContent = playText[lang];
        }
      }

      /* =========================
  FETCH & APPLY SIDEBAR
  ========================= */
      fetch("sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebarPlaceholder").innerHTML = data;

          // Apply language after sidebar is inserted
          applyLanguage();

          const sidebar = document.getElementById("sidebar");
          const toggle = document.getElementById("sidebarToggle");
          const scoreDisplay = document.getElementById("playerScore");
          const quitBtn = sidebar.querySelector("#quitGameBtn");

          // Toggle sidebar & fetch score
          toggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            fetchScore();
          });

          // Quit button uses translated confirm
          quitBtn.addEventListener("click", () => {
            if (confirm(getText("quitConfirm"))) {
              window.location.href = "/Pages/Homepage.html";
            }
          });

          // Set username
          const username = sessionStorage.getItem("player_name") || "Player";
          document.getElementById("username").textContent = username;

          // Fetch player score
          function fetchScore() {
            fetch("../Logic/get_score.php")
              .then((res) => res.json())
              .then((data) => {
                scoreDisplay.textContent = data.score;
              })
              .catch((err) => console.error("Error fetching score:", err));
          }

          setInterval(fetchScore, 5000);
        });
    </script>
</html>
