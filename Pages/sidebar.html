<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sidebar with Player Score</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: "Luckiest Guy", cursive;
    background: #1e1e1e;
    color: #fff;
  }

  /* Sidebar */
  #sidebar {
    position: fixed;
    top: 0;
    left: -320px; /* completely off-screen */
    width: 280px;
    height: 100%;
    background: #5dade2;
    backdrop-filter: blur(6px);
    padding: 25px 20px 120px 20px;
    box-shadow: 2px 0 15px rgba(0,0,0,0.5);
    z-index: 9998;
    display: flex;
    flex-direction: column;
    color: #fff;
    border-radius: 0 15px 15px 0;
    transition: left 0.4s ease;
  }
  #sidebar.open {
    left: 0;
  }

  /* Sidebar header */
  .sidebar-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .sidebar-header img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin-bottom: 10px;
    border: 2px solid #fff;
  }
  .sidebar-header h3 {
    margin: 0;
    font-size: 1.6rem;
  }

  /* Sections */
  .sidebar-section {
    margin-bottom: 35px;
    display: flex;
    flex-direction: column;
    font-size: 1.2rem;
  }
  .sidebar-section label {
    margin-bottom: 12px;
    font-family: "Luckiest Guy", cursive;
  }
  .sidebar-section select {
    width: 100%;
    height: 40px;
    font-family: "Luckiest Guy", cursive;
    font-size: 1.2rem;
    padding: 5px;
    margin-bottom: 25px;
    border-radius: 8px;
    border: none;
  }
  .sidebar-section p {
    font-family: "Luckiest Guy", cursive;
    font-size: 1.3rem;
    margin: 0;
    padding: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    text-align: center;
  }

  /* Quit button */
  #quitGameBtn {
    font-family: "Luckiest Guy", cursive;
    background-color: #dc3545;
    color: white;
    border: none;
    padding: 14px 0;
    font-size: 1.4rem;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    margin-top: auto;
    margin-bottom: 40px;
    transition: transform 0.2s, background 0.3s;
  }
  #quitGameBtn:hover { background-color: #ff4d4d; transform: scale(1.05); }

  /* Gear toggle icon */
  #sidebarToggle {
    position: fixed;
    bottom: 5px;
    left: 0; /* start at screen edge */
    font-size: 2.2rem;
    background: #5dade2;
    padding: 12px;
    border-radius: 0 12px 12px 0;
    cursor: pointer;
    z-index: 9999;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left 0.4s ease, background 0.3s, transform 0.3s;
  }
  #sidebarToggle:hover {
    background: rgba(41,128,185,0.9);
  }

  /* Move toggle along with sidebar, placed just outside sidebar */
  #sidebar.open ~ #sidebarToggle {
    left: 320px; /* sidebar width */
  }

</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header">
    <img src="https://via.placeholder.com/70" alt="Profile">
    <h3 id="username">Player</h3>
  </div>

  <div class="sidebar-section">
    <label for="languageSelect">Language</label>
    <select id="languageSelect">
      <option>English</option>
      <option>Malay</option>
      <option>Chinese</option>
    </select>
  </div>

  <div class="sidebar-section">
    <label>Player Score</label>
    <p id="playerScore">0</p>
  </div>

  <button id="quitGameBtn">Quit Game</button>
</div>

<!-- Gear toggle button -->
<div id="sidebarToggle">
  <i class="bi bi-gear-fill"></i>
</div>

<script>
  const toggle = document.getElementById("sidebarToggle");
  const sidebar = document.getElementById("sidebar");
  const quitBtn = document.getElementById("quitGameBtn");
  const scoreDisplay = document.getElementById("playerScore");

  // Toggle sidebar & fetch score
  toggle.addEventListener("click", () => {
    sidebar.classList.toggle("open");
    fetchScore();
  });

  // Quit with confirm
  quitBtn.addEventListener("click", () => {
    if(confirm("Are you sure you want to quit?")) {
      window.location.href = "/Pages/Homepage.html";
    }
  });

  // Set username
  document.getElementById("username").textContent = sessionStorage.getItem("player_name") || "Player";

  // Fetch player score
  function fetchScore() {
    fetch("../Logic/get_score.php")
      .then(res => res.json())
      .then(data => { scoreDisplay.textContent = data.score; })
      .catch(err => console.error("Error fetching score:", err));
  }
</script>

</body>
</html>
